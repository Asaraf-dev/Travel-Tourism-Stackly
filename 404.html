<!--- 404 Page --->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Travel & Tourism</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/404.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!--- 404 Section --->
    <main class="tt-404-page">
        <div class="tt-404-glow tt-404-glow-one"></div>
        <div class="tt-404-glow tt-404-glow-two"></div>
        <div class="tt-404-route tt-404-route-one"></div>
        <div class="tt-404-route tt-404-route-two"></div>
        <div class="tt-404-decoration tt-404-decoration-one"><i class="bi bi-cloud"></i></div>
        <div class="tt-404-decoration tt-404-decoration-two"><i class="bi bi-cloud"></i></div>
        <div class="container">
            <div class="tt-404-content">
                <div class="tt-404-compass">
                    <div class="tt-404-compass-ring"></div>
                    <div class="tt-404-compass-center"><i class="bi bi-compass"></i></div>
                    <span class="tt-404-compass-dot tt-404-compass-dot-one"></span>
                    <span class="tt-404-compass-dot tt-404-compass-dot-two"></span>
                    <span class="tt-404-compass-dot tt-404-compass-dot-three"></span>
                    <span class="tt-404-compass-dot tt-404-compass-dot-four"></span>
                </div>
                <span class="tt-404-kicker"><i class="bi bi-geo-alt"></i> Destination Not Found</span>
                <h1 class="tt-404-number">4<span>0</span>4</h1>
                <h2 class="tt-404-title">Looks like you've taken a wrong turn.</h2>
                <p class="tt-404-description">The destination you're looking for has moved, disappeared, or may never
                    have existed. Let's get you back on the right path.</p>
                <div class="tt-404-actions">
                    <button type="button" class="tt-404-back-btn" id="tt404BackBtn"><i
                            class="bi bi-arrow-left"></i><span>Go Back</span></button>
                    <a href="index.html" class="tt-404-home-btn"><span>Go To Home</span><i
                            class="bi bi-arrow-up-right"></i></a>
                </div>
                <div class="tt-404-travel-path">
                    <span class="tt-404-path-start"><i class="bi bi-geo-alt-fill"></i></span>
                    <span class="tt-404-path-line"></span>
                    <span class="tt-404-path-plane"><i class="fa-solid fa-plane"></i></span>
                    <span class="tt-404-path-end"><i class="bi bi-geo-alt-fill"></i></span>
                </div>
            </div>
        </div>
    </main>
    <script src="assets/js/404.js"></script>
</body>

</html>
